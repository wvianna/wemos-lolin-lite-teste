; Monitor de tensão de bateria — WEMOS LOLIN32 Lite (ESP32, framework Arduino).
;
; Alvo:        pio run -d firmware -e lolin32_lite
; Testes HOST: pio test -d firmware -e native
;
; Env `native` compila apenas a lógica pura (`lib/battery_logic`): a camada HAL em
; `src/` depende do SDK do ESP32 e não é construída para o HOST (test_build_src = no).

[platformio]
default_envs = lolin32_lite

[env:lolin32_lite]
platform = espressif32@6.9.0
board = lolin32_lite
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
